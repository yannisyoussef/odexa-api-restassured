name: QA checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'SHA-verified Odexa release'
        type: choice
        required: false
        default: v0.1.0
        options:
          - v0.1.0

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Java 25 and boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: HTTP-only source and dependency boundary
        run: python3 -B scripts/check-boundaries.py
      - name: Isolated orchestration unit tests (no Docker)
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Compile, Spotless, and framework unit tests
        run: ./gradlew --no-daemon --no-configuration-cache --console=plain spotlessCheck check
      - name: Upload QA unit reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-unit-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
            build/allure-results/test/
            build/test-results/provisioningUnitTest/*.xml
            build/reports/tests/provisioningUnitTest/

  compose:
    name: COMPOSE black-box API against pinned v0.1.0
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Input is passed as environment data, never interpolated into a shell command.
      ODEXA_VERSION: ${{ inputs.target_version || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify Docker tooling
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version --short
      - name: Bootstrap product, check readiness, run QA, and remove owned volumes
        # The script traps cooperative cancellation and cleans up on all lifecycle failures.
        # Fixed product ports require this exclusive hosted runner; no existing dev target is used.
        run: python3 -B scripts/local-ci.py
      - name: Upload only QA results and allowlisted metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-compose-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/test-results/apiTest/*.xml
            build/reports/tests/apiTest/
            build/allure-results/apiTest/
            build/diagnostics/local-target.json

  testcontainers:
    name: TESTCONTAINERS black-box API against pinned v0.1.0
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ODEXA_VERSION: ${{ inputs.target_version || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Provision real services, run shared API scenarios, and clean owned resources
        run: ./gradlew --no-daemon --no-configuration-cache --console=plain testcontainersTest
      - name: Upload only QA results and allowlisted provisioning metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-testcontainers-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/test-results/testcontainersTest/*.xml
            build/reports/tests/testcontainersTest/
            build/allure-results/testcontainersTest/
            build/diagnostics/testcontainers-target.json
